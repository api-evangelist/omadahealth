name: Omada Health
description: 'Omada Health is a virtual-care company that delivers personalized, evidence-based
  programs for managing and preventing chronic conditions including prediabetes, type 2 diabetes,
  hypertension, and musculoskeletal (joint and muscle) health, plus GLP-1 support. Sold to
  employers and health plans, Omada pairs human health coaches with connected smart devices and
  a mobile app to drive measurable, scalable behavior change. Backed by Norwest Venture Partners.
  No public developer API surface was found during enrichment; this profile captures the company''s
  security, compliance, and public-web posture.'
